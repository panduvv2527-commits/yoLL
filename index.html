<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============ THEME ============ */
:root {
  --bg-1:#05060f; --bg-2:#0b0e1f; --bg-3:#131736;
  --text:#eef1ff; --muted:#9aa3c7;
  --card-bg:rgba(20,24,48,0.88);
  --card-border:rgba(140,160,255,0.16);
  --accent:#7c5cff; --accent-2:#22d3ee; --accent-3:#ff4ecd;
  --green:#22c55e; --yellow:#eab308; --red:#ef4444;
  --shadow:0 18px 36px -18px rgba(0,0,0,0.6);
  --glass:rgba(255,255,255,0.05);
}
[data-theme="light"] {
  --bg-1:#eef1ff; --bg-2:#e2e7ff; --bg-3:#d5dcff;
  --text:#10122a; --muted:#4a5080;
  --card-bg:rgba(255,255,255,0.92);
  --card-border:rgba(60,80,180,0.16);
  --glass:rgba(255,255,255,0.65);
  --shadow:0 18px 36px -18px rgba(60,70,150,0.35);
}

* { box-sizing:border-box; margin:0; padding:0; }
html { scroll-behavior:smooth; -webkit-text-size-adjust:100%; }
body {
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  color:var(--text);
  background:var(--bg-1);
  min-height:100vh;
  overflow-x:hidden;
  transition:background .4s,color .4s;
  -webkit-font-smoothing:antialiased;
}

/* ============ STATIC BACKGROUND (no animation) ============ */
.bg-layer {
  position:fixed; inset:0; z-index:-2; pointer-events:none;
  background:
    radial-gradient(circle at 15% 10%, rgba(124,92,255,0.28), transparent 45%),
    radial-gradient(circle at 85% 20%, rgba(34,211,238,0.22), transparent 45%),
    radial-gradient(circle at 50% 100%, rgba(255,78,205,0.22), transparent 55%),
    linear-gradient(160deg, var(--bg-1), var(--bg-2), var(--bg-3));
}

/* ============ NAVBAR (light glass, only 1 blur on page) ============ */
.navbar {
  position:sticky; top:0; z-index:50;
  display:flex; align-items:center; justify-content:space-between;
  gap:12px;
  padding:12px 18px;
  padding-top:calc(12px + env(safe-area-inset-top,0px));
  background:var(--card-bg);
  border-bottom:1px solid var(--card-border);
}
.logo {
  font-family:'Space Grotesk',sans-serif;
  font-weight:700; font-size:1.3rem; letter-spacing:-0.02em;
  background:linear-gradient(135deg,var(--accent),var(--accent-2),var(--accent-3));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.logo small { opacity:.55; font-weight:400; font-size:.75rem; margin-left:4px; }
.theme-toggle {
  width:40px; height:40px; border-radius:11px;
  border:1px solid var(--card-border);
  background:var(--card-bg);
  color:var(--text); cursor:pointer; font-size:1rem;
  display:grid; place-items:center;
  transition:transform .2s, box-shadow .2s;
  box-shadow:var(--shadow);
}
.theme-toggle:hover { transform:translateY(-2px); }
.theme-toggle:active { transform:scale(.95); }

/* ============ HERO ============ */
.hero { text-align:center; padding:56px 18px 30px; }
.hero h1 {
  font-family:'Space Grotesk',sans-serif;
  font-size:clamp(2rem,7vw,4.2rem);
  font-weight:700; letter-spacing:-0.03em; line-height:1.05;
  background:linear-gradient(135deg,#fff 10%,var(--accent-2) 50%,var(--accent-3) 95%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.hero p {
  margin-top:14px; color:var(--muted);
  font-size:clamp(.9rem,2.1vw,1.08rem);
  max-width:600px; margin-left:auto; margin-right:auto;
}
.hero .count {
  display:inline-block; margin-top:20px; padding:6px 14px;
  border-radius:999px; font-size:.78rem; font-weight:600;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;
}

/* ============ CONTROLS ============ */
.controls {
  max-width:1200px; margin:14px auto 0; padding:0 18px;
  display:flex; flex-direction:column; gap:14px;
}
.search-wrap { position:relative; }
.search-wrap input {
  width:100%;
  padding:14px 18px 14px 46px;
  border-radius:14px;
  border:1px solid var(--card-border);
  background:var(--card-bg);
  color:var(--text);
  font-size:.95rem; font-family:inherit;
  outline:none;
  transition:border-color .25s, box-shadow .25s;
  box-shadow:var(--shadow);
}
.search-wrap input:focus {
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(124,92,255,0.25);
}
.search-wrap .icon {
  position:absolute; left:16px; top:50%; transform:translateY(-50%);
  color:var(--muted); font-size:1rem; pointer-events:none;
}

.chips { display:flex; gap:8px; flex-wrap:wrap; }
.chip {
  padding:8px 14px;
  border-radius:999px;
  border:1px solid var(--card-border);
  background:var(--card-bg);
  color:var(--text);
  font-size:.82rem; font-family:inherit;
  cursor:pointer;
  white-space:nowrap;
  transition:background .2s, color .2s, transform .15s;
  -webkit-tap-highlight-color:transparent;
}
.chip:active { transform:scale(.96); }
.chip.active {
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff; border-color:transparent;
  box-shadow:0 8px 18px rgba(124,92,255,0.35);
}

/* ============ GRID ============ */
.grid {
  max-width:1200px;
  margin:26px auto 70px;
  padding:0 18px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:18px;
  contain:layout paint;
}
@media (max-width:640px) {
  .grid { grid-template-columns:1fr; gap:14px; padding:0 14px; }
  .hero { padding-top:42px; }
}

/* ============ CARD ============ */
.card {
  position:relative;
  border-radius:18px;
  padding:20px;
  background:var(--card-bg);
  border:1px solid var(--card-border);
  box-shadow:var(--shadow);
  opacity:0;
  translate:0 20px;
  transition:opacity .45s ease, translate .45s ease, box-shadow .3s ease, transform .3s ease;
  will-change:transform;
}
.card.reveal { opacity:1; translate:0 0; }
.card:hover {
  box-shadow:0 24px 48px -20px rgba(124,92,255,0.45), var(--shadow);
}

/* subtle cursor-follow glow (desktop only) */
@media (hover:hover) {
  .card::before {
    content:"";
    position:absolute; inset:0;
    border-radius:18px;
    background:radial-gradient(220px circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,0.10), transparent 50%);
    opacity:0;
    transition:opacity .3s;
    pointer-events:none;
  }
  .card:hover::before { opacity:1; }
}

.card-header {
  display:flex; align-items:flex-start; justify-content:space-between;
  gap:10px; margin-bottom:10px;
}
.card-icon {
  width:44px; height:44px; border-radius:12px;
  display:grid; place-items:center;
  font-size:1.35rem;
  background:linear-gradient(135deg, rgba(124,92,255,0.35), rgba(34,211,238,0.3));
  box-shadow:0 6px 16px rgba(124,92,255,0.3), inset 0 1px 0 rgba(255,255,255,0.15);
}
.badge {
  font-size:.68rem; font-weight:700; letter-spacing:.03em;
  padding:5px 10px; border-radius:999px;
  text-transform:uppercase;
}
.badge.free     { background:rgba(34,197,94,0.18); color:var(--green);  border:1px solid rgba(34,197,94,0.4); }
.badge.freemium { background:rgba(234,179,8,0.18); color:var(--yellow); border:1px solid rgba(234,179,8,0.4); }
.badge.paid     { background:rgba(239,68,68,0.18); color:var(--red);    border:1px solid rgba(239,68,68,0.4); }

.card h3 {
  font-family:'Space Grotesk',sans-serif;
  font-size:1.1rem; font-weight:700;
  margin-bottom:6px; letter-spacing:-0.01em;
}
.card p {
  color:var(--muted); font-size:.86rem; line-height:1.5;
  min-height:42px;
}
.card-footer {
  display:flex; align-items:center; justify-content:space-between;
  margin-top:14px; gap:8px;
}
.cat-tag {
  font-size:.7rem; color:var(--muted);
  padding:4px 10px; border-radius:8px;
  background:rgba(255,255,255,0.05);
  border:1px solid var(--card-border);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.visit {
  text-decoration:none;
  font-size:.82rem; font-weight:600;
  padding:8px 14px; border-radius:11px;
  color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  transition:transform .15s, box-shadow .2s;
  white-space:nowrap;
  -webkit-tap-highlight-color:transparent;
}
.visit:hover { box-shadow:0 10px 22px rgba(124,92,255,0.55); }
.visit:active { transform:scale(.96); }

/* ============ EMPTY ============ */
.empty {
  grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--muted);
}
.empty .big { font-size:3rem; margin-bottom:10px; }

/* ============ FOOTER ============ */
footer {
  text-align:center; padding:36px 18px 26px;
  padding-bottom:calc(26px + env(safe-area-inset-bottom,0px));
  color:var(--muted); font-size:.82rem;
  border-top:1px solid var(--card-border);
}
footer strong {
  background:linear-gradient(135deg,var(--accent),var(--accent-3));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}

/* ============ MOBILE: kill hover effects ============ */
@media (hover:none) {
  .card:hover { transform:none !important; box-shadow:var(--shadow); }
  .visit:hover { box-shadow:none; }
  .theme-toggle:hover { transform:none; }
  .card { transition:opacity .35s ease, translate .35s ease; }
}

/* ============ REDUCED MOTION ============ */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration:0.001ms !important;
    transition-duration:0.001ms !important;
  }
  .card { opacity:1; translate:0; }
}
</style>
</head>

/* ============================================================
   STATE
   ============================================================ */
const state = { cat:"All", price:"All", q:"" };
const catIcons = {
  All:"🌟", Image:"🖼️", Writing:"✍️", Coding:"💻", Video:"🎬",
  Audio:"🎵", Productivity:"📊", Research:"🔍",
  Design:"🎨", Chatbots:"🤖", Marketing:"📈"
};
const categories = ["All","Image","Writing","Coding","Video","Audio","Productivity","Research","Design","Chatbots","Marketing"];
const priceLabels = { All:"All Prices", free:"Free", freemium:"Freemium", paid:"Paid" };

/* ============================================================
   DOM
   ============================================================ */
const grid = document.getElementById("grid");
const searchInput = document.getElementById("search");
const catChips = document.getElementById("catChips");
const priceChips = document.getElementById("priceChips");
const countEl = document.getElementById("count");

/* ============================================================
   CHIPS
   ============================================================ */
function buildChips() {
  const catFrag = document.createDocumentFragment();
  categories.forEach(c => {
    const b = document.createElement("button");
    b.className = "chip" + (c === state.cat ? " active" : "");
    b.textContent = `${catIcons[c]} ${c}`;
    b.dataset.cat = c;
    b.onclick = () => { state.cat = c; refreshChips(); render(); };
    catFrag.appendChild(b);
  });
  catChips.appendChild(catFrag);

  const priceFrag = document.createDocumentFragment();
  Object.keys(priceLabels).forEach(p => {
    const b = document.createElement("button");
    b.className = "chip" + (p === state.price ? " active" : "");
    b.textContent = priceLabels[p];
    b.dataset.price = p;
    b.onclick = () => { state.price = p; refreshChips(); render(); };
    priceFrag.appendChild(b);
  });
  priceChips.appendChild(priceFrag);
}
function refreshChips() {
  [...catChips.children].forEach(b => b.classList.toggle("active", b.dataset.cat === state.cat));
  [...priceChips.children].forEach(b => b.classList.toggle("active", b.dataset.price === state.price));
}

/* ============================================================
   RENDER (uses DocumentFragment — much faster)
   ============================================================ */
let revealObserver = null;
function initObserver() {
  if (!("IntersectionObserver" in window)) return;
  revealObserver = new IntersectionObserver((entries) => {
    entries.forEach(en => {
      if (en.isIntersecting) {
        en.target.classList.add("reveal");
        revealObserver.unobserve(en.target);
      }
    });
  }, { rootMargin: "0px 0px -40px 0px", threshold: 0.01 });
}

function render() {
  const q = state.q.trim().toLowerCase();
  const list = tools.filter(t => {
    if (state.cat !== "All" && t.c !== state.cat) return false;
    if (state.price !== "All" && t.p !== state.price) return false;
    if (q && !(t.n.toLowerCase().includes(q) || t.d.toLowerCase().includes(q) || t.c.toLowerCase().includes(q))) return false;
    return true;
  });

  countEl.textContent = `${tools.length} tools · showing ${list.length}`;

  const frag = document.createDocumentFragment();
  if (!list.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.innerHTML = `<div class="big">🛸</div><div>No tools match your filters.</div>`;
    frag.appendChild(empty);
  } else {
    list.forEach(t => {
      const card = document.createElement("article");
      card.className = "card";
      card.innerHTML = `
        <div class="card-header">
          <div class="card-icon">${t.i}</div>
          <span class="badge ${t.p}">${t.p}</span>
        </div>
        <h3>${t.n}</h3>
        <p>${t.d}</p>
        <div class="card-footer">
          <span class="cat-tag">${catIcons[t.c]} ${t.c}</span>
          <a class="visit" href="${t.u}" target="_blank" rel="noopener">Visit →</a>
        </div>`;
      frag.appendChild(card);
    });
  }
  grid.replaceChildren(frag);

  // reveal animation via IntersectionObserver
  const cards = grid.querySelectorAll(".card");
  if (revealObserver) {
    cards.forEach(c => revealObserver.observe(c));
  } else {
    cards.forEach(c => c.classList.add("reveal"));
  }

  // 3D tilt only on hover-capable devices
  if (isHoverable) cards.forEach(attach3DTilt);
}

/* ============================================================
   3D TILT (desktop only, throttled with rAF)
   ============================================================ */
const isHoverable = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
function attach3DTilt(card) {
  let raf = 0, rx = 0, ry = 0, mx = 0, my = 0;
  card.addEventListener("mousemove", e => {
    const r = card.getBoundingClientRect();
    mx = e.clientX - r.left;
    my = e.clientY - r.top;
    rx = ((my - r.height/2) / (r.height/2)) * -6;
    ry = ((mx - r.width/2)  / (r.width/2))  * 6;
    if (!raf) raf = requestAnimationFrame(() => {
      card.style.transform = `perspective(900px) rotateX(${rx}deg) rotateY(${ry}deg) translateZ(6px)`;
      card.style.setProperty("--mx", mx + "px");
      card.style.setProperty("--my", my + "px");
      raf = 0;
    });
  });
  card.addEventListener("mouseleave", () => {
    card.style.transform = "";
  });
}

/* ============================================================
   SEARCH (debounced)
   ============================================================ */
let searchTimer;
searchInput.addEventListener("input", e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { state.q = e.target.value; render(); }, 120);
});

/* ============================================================
   THEME
   ============================================================ */
const themeBtn = document.getElementById("themeBtn");
const root = document.documentElement;
const saved = localStorage.getItem("yoll-theme");
if (saved) {
  root.dataset.theme = saved;
  themeBtn.textContent = saved === "dark" ? "🌙" : "☀️";
}
themeBtn.onclick = () => {
  const next = root.dataset.theme === "dark" ? "light" : "dark";
  root.dataset.theme = next;
  themeBtn.textContent = next === "dark" ? "🌙" : "☀️";
  localStorage.setItem("yoll-theme", next);
};

/* ============================================================
   INIT
   ============================================================ */
document.getElementById("year").textContent = new Date().getFullYear();
initObserver();
buildChips();
render();
</script>
